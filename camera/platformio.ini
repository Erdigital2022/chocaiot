; ChocaIoT-Camera — platformio.ini
; Projeto SEPARADO do controlador principal.
;
; Board: ESP32-S3-WROOM-1 N16R8 CAM (com OV5640)
; Corrigido em 26/07/2026: removida -DARDUINO_USB_CDC_ON_BOOT=1
; (mesmo bug já resolvido no controlador — essa flag desvia o Serial
; para a porta USB-OTG em vez da USB-UART/CH343P que aparece como COM10)
;
; Dois ambientes (Fase 50):
;   esp32-s3-cam           -> src/main.cpp        : TESTE de hardware (SD + fotos VGA/XGA/UXGA + guarda térmica)
;   esp32-s3-cam-servidor  -> src/servidor/*      : firmware de PRODUÇÃO (servidor HTTP na rede local; ver docs/INTEGRACAO.md)

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_port = COM10

lib_ldf_mode = chain

board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi   ; N16R8 = Quad Flash + Octal PSRAM
board_upload.flash_size = 16MB

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; -DARDUINO_USB_CDC_ON_BOOT=1   <- REMOVIDA: usar USB-UART (CH343P) por enquanto

lib_deps =
    espressif/esp32-camera @ ^2.0.4

[env:esp32-s3-cam]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_port = ${common.monitor_port}
lib_ldf_mode = ${common.lib_ldf_mode}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_upload.flash_size = ${common.board_upload.flash_size}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
build_src_filter = +<*> -<servidor/> -<*.bk>

[env:esp32-s3-cam-servidor]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_port = ${common.monitor_port}
lib_ldf_mode = ${common.lib_ldf_mode}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_upload.flash_size = ${common.board_upload.flash_size}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
build_src_filter = -<*> +<servidor/>
