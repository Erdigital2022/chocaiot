; ChocaIoT — platformio.ini — Fase 7 (Atuadores) rev2
; Bluetooth/NimBLE removido: pausado ha semanas sem uso real, e a
; inicializacao do controlador BLE reservava memoria interna
; permanentemente, alem de possivelmente gerar conflito de
; coexistencia RF durante o WiFi.scanNetworks() -- suspeito do
; reset relatado ao abrir a tela de WiFi.

[env:esp32-s3-controller]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_port = COM8

lib_ldf_mode = chain

board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

lib_deps =
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit ADXL345
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    mobizt/FirebaseClient
    bodmer/TFT_eSPI
    bodmer/TJpg_Decoder
    ricmoo/QRCode
    adafruit/RTClib
    ;h2zero/NimBLE-Arduino (removido — BT pausado, suspeito do reset no WiFi)
    ;tzapu/WiFiManager (substituído pela UI nativa)
    ;bitbank2/AnimatedGIF (não usado no boot atual)

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -include lib/TFT_eSPI_Custom/User_Setup.h
    -DBOARD_HAS_PSRAM
    ;-DARDUINO_USB_CDC_ON_BOOT=1

; Câmera — projeto separado (chocaiot-camera/)x