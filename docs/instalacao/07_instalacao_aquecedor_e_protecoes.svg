<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs><linearGradient id="gfundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#0b1020"/></linearGradient><linearGradient id="gcalor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb199"/><stop offset="1" stop-color="#ff7a45"/></linearGradient><linearGradient id="gagua" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><linearGradient id="gouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d27a"/><stop offset="1" stop-color="#a87a1e"/></linearGradient><filter id="brilho" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="url(#gfundo)"/>
<text x="50" y="66" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="38" font-weight="700" fill="#e6ebff" text-anchor="start">Instalação do aquecedor e das proteções elétricas (220 V)</text>
<text x="50" y="102" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="400" fill="#8da0c8" text-anchor="start">O firmware comanda o relé, mas a segurança precisa de proteções em hardware que independam do software.</text>
<text x="1750" y="1076" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b92" text-anchor="end">ChocaIoT · guia de instalação · tema escuro</text>
<text x="60" y="150" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#8da0c8" text-anchor="start">Esquema unifilar da carga de 220 V</text>
<rect x="100" y="190" width="190" height="92" rx="12" fill="#18213d" stroke="#8da0c8" stroke-width="3"/>
<text x="195" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#8da0c8" text-anchor="middle">Tomada</text>
<text x="195" y="256" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">L · N · PE</text>
<rect x="320" y="190" width="190" height="92" rx="12" fill="#18213d" stroke="#f87171" stroke-width="3"/>
<text x="415" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#f87171" text-anchor="middle">DR + disjuntor</text>
<text x="415" y="256" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">proteção geral</text>
<rect x="540" y="190" width="190" height="92" rx="12" fill="#18213d" stroke="#fbbf24" stroke-width="3"/>
<text x="635" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="middle">Fusível</text>
<text x="635" y="256" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">2 A (carga ≈ 100 W)</text>
<rect x="760" y="190" width="190" height="92" rx="12" fill="#18213d" stroke="#f43f5e" stroke-width="3"/>
<text x="855" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#f43f5e" text-anchor="middle">Relé CH1</text>
<text x="855" y="256" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">contato NA na FASE</text>
<rect x="980" y="190" width="190" height="92" rx="12" fill="#18213d" stroke="#ff7a45" stroke-width="3"/>
<text x="1075" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ff7a45" text-anchor="middle">Fusível térmico</text>
<text x="1075" y="256" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">ou termostato, em série</text>
<path d="M290,236 L320,236" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M510,236 L540,236" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M730,236 L760,236" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M950,236 L980,236" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1200" y="190" width="150" height="92" rx="12" fill="#2a1409" stroke="#ff7a45" stroke-width="3"/>
<text x="1275" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ff7a45" text-anchor="middle">Resistência</text>
<text x="1275" y="256" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">/ lâmpada</text>
<path d="M1170,236 L1200,236" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140" y="180" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#f43f5e" text-anchor="start">FASE (L)</text>
<path d="M190,282 L190,330 L1275,330 L1275,282" fill="none" stroke="#e6ebff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700" y="356" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="middle">NEUTRO (N) — direto, sem interromper</text>
<path d="M120,282 L120,420 L1000,420" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/>
<rect x="1000" y="396" width="190" height="48" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
<text x="1095" y="427" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">TERRA → partes metálicas</text>
<rect x="760" y="470" width="190" height="60" rx="8" fill="#10261f" stroke="#1fbf8e" stroke-width="2"/>
<text x="855" y="508" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">ESP32 · GPIO1 → IN1</text>
<path d="M855,470 L855,286" fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#seta)"/>
<text x="840" y="380" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5eead4" text-anchor="end">sinal 3,3 V (pull-up 10 kΩ)</text>
<text x="60" y="600" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#8da0c8" text-anchor="start">Posicionamento da resistência</text>
<rect x="100" y="650" width="600" height="360" rx="14" fill="#0f1730" stroke="#4a5f9c" stroke-width="4"/>
<rect x="220" y="670" width="260" height="26" rx="6" fill="#2a2f45" stroke="#3a4a7a" stroke-width="2"/>
<circle cx="350.0" cy="710" r="60" fill="#ff7a45" opacity="0.45" filter="url(#brilho)"/>
<rect x="234" y="696" width="232" height="22" rx="8" fill="url(#gcalor)" stroke="#ff7a45" stroke-width="2"/>
<path d="M250.0,726 L250.0,770" fill="none" stroke="#ff7a45" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#seta)"/>
<path d="M300.0,726 L300.0,770" fill="none" stroke="#ff7a45" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#seta)"/>
<path d="M350.0,726 L350.0,770" fill="none" stroke="#ff7a45" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#seta)"/>
<path d="M400.0,726 L400.0,770" fill="none" stroke="#ff7a45" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#seta)"/>
<path d="M450.0,726 L450.0,770" fill="none" stroke="#ff7a45" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#seta)"/>
<rect x="220" y="650" width="260" height="20" rx="4" fill="#374151" stroke="#94a3b8" stroke-width="2"/>
<text x="350" y="645" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">refletor / suporte metálico</text>
<rect x="500" y="690" width="120" height="50" rx="8" fill="#1f2937" stroke="#ff7a45" stroke-width="2"/>
<text x="560" y="712" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6ebff" text-anchor="middle">fusível</text>
<text x="560" y="730" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6ebff" text-anchor="middle">térmico</text>
<line x1="480" y1="700" x2="500" y2="710" stroke="#ff7a45" stroke-width="2" stroke-linecap="round"/>
<line x1="230" y1="790" x2="230" y2="900" stroke="#8da0c8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="250" y="850" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="start">≥ 12 cm</text>
<rect x="180" y="900" width="400" height="20" rx="6" fill="#2a3558" stroke="#6b86c9" stroke-width="2"/>
<ellipse cx="220" cy="876" rx="19" ry="25" fill="#f1dfbb" stroke="#b79b62" stroke-width="2"/>
<ellipse cx="274" cy="876" rx="19" ry="25" fill="#f1dfbb" stroke="#b79b62" stroke-width="2"/>
<ellipse cx="328" cy="876" rx="19" ry="25" fill="#f1dfbb" stroke="#b79b62" stroke-width="2"/>
<ellipse cx="382" cy="876" rx="19" ry="25" fill="#f1dfbb" stroke="#b79b62" stroke-width="2"/>
<ellipse cx="436" cy="876" rx="19" ry="25" fill="#f1dfbb" stroke="#b79b62" stroke-width="2"/>
<ellipse cx="490" cy="876" rx="19" ry="25" fill="#f1dfbb" stroke="#b79b62" stroke-width="2"/>
<text x="380" y="960" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#f87171" text-anchor="middle">nunca encostar no isopor/plástico</text>
<rect x="1000" y="480" width="750" height="560" rx="16" fill="#121a30" stroke="#2a3558" stroke-width="2"/>
<text x="1022" y="518" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#8da0c8" text-anchor="start">Regras de instalação</text>
<line x1="1022" y1="532" x2="1728" y2="532" stroke="#2a3558" stroke-width="2" stroke-linecap="round"/>
<circle cx="1046" cy="554" r="17" fill="#f43f5e" stroke="#0b1020" stroke-width="3"/>
<text x="1046" y="560" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">1</text>
<text x="1076" y="560" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Corte a energia e confirme com multímetro antes de mexer.</text>
<circle cx="1046" cy="588" r="17" fill="#f43f5e" stroke="#0b1020" stroke-width="3"/>
<text x="1046" y="594" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">2</text>
<text x="1076" y="594" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Fase → DR/disjuntor → fusível → contato NA do relé → termostato/fusível</text>
<text x="1076" y="616" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">térmico → carga. Neutro direto à carga.</text>
<circle cx="1046" cy="644" r="17" fill="#f43f5e" stroke="#0b1020" stroke-width="3"/>
<text x="1046" y="650" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">3</text>
<text x="1076" y="650" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">A proteção térmica em série vale mesmo se o firmware travar (o relé colado</text>
<text x="1076" y="672" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">nunca deve superaquecer a caixa).</text>
<circle cx="1046" cy="700" r="17" fill="#f43f5e" stroke="#0b1020" stroke-width="3"/>
<text x="1046" y="706" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">4</text>
<text x="1076" y="706" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Fios de 220 V longe do I2C, do SPI e da água; terminais com tampa; emendas</text>
<text x="1076" y="728" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">isoladas.</text>
<circle cx="1046" cy="756" r="17" fill="#f43f5e" stroke="#0b1020" stroke-width="3"/>
<text x="1046" y="762" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">5</text>
<text x="1076" y="762" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Use a potência adequada: 100 W numa caixa de 3 L é ~10× o necessário; informe</text>
<text x="1076" y="784" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">potência e volume em Hardware.</text>
<rect x="1030" y="823" width="465" height="29" rx="10" fill="#fbbf24" stroke="#fbbf24" stroke-width="1" opacity="0.18"/>
<rect x="1030" y="823" width="465" height="29" rx="10" fill="none" stroke="#fbbf24" stroke-width="2"/>
<text x="1040" y="845" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start">Primeiro teste: lâmpada comum no lugar da resistência</text>
</svg>