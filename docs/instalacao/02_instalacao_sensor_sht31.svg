<text x="520" y="322" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="start">posição ideal</text>
<line x1="420" y1="232" x2="460" y2="258" stroke="#8da0c8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="380" y="252" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#8da0c8" text-anchor="start">5–10 cm</text>
<rect x="560" y="687" width="196" height="29" rx="10" fill="#f87171" stroke="#f87171" stroke-width="1" opacity="0.18"/>
<rect x="560" y="687" width="196" height="29" rx="10" fill="none" stroke="#f87171" stroke-width="2"/>
<text x="570" y="709" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start">zona vermelha = evite</text>
<text x="60" y="720" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#8da0c8" text-anchor="start">Passagem do cabo (corte)</text>
