<text x="320" y="980" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#38bdf8" text-anchor="middle">laço de gotejamento</text>
<path d="M320,968 L320,950" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#seta)"/>
<text x="60" y="836" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#34d399" text-anchor="start">sonda</text>
<text x="480" y="862" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="start">→ eletrônica</text>
<circle cx="250" cy="800" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="250" y="806" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">2</text>
<circle cx="380" cy="1000" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="380" y="1006" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">3</text>
<rect x="900" y="150" width="850" height="890" rx="16" fill="#121a30" stroke="#2a3558" stroke-width="2"/>
<text x="922" y="188" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#8da0c8" text-anchor="start">Passo a passo</text>
<line x1="922" y1="202" x2="1728" y2="202" stroke="#2a3558" stroke-width="2" stroke-linecap="round"/>
<circle cx="946" cy="222" r="17" fill="#34d399" stroke="#0b1020" stroke-width="3"/>
<text x="946" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">1</text>
<text x="976" y="228" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">Instale o SHT31 na altura dos ovos, no meio da bandeja ou levemente deslocado para o</text>
<text x="976" y="251" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">lado oposto ao aquecedor (5–10 cm de distância).</text>
<circle cx="946" cy="280" r="17" fill="#34d399" stroke="#0b1020" stroke-width="3"/>
<text x="946" y="286" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">2</text>
<text x="976" y="286" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">Passe o cabo por um prensa-cabo (ou furo vedado com silicone) na parede. Sem folga:</text>
<text x="976" y="309" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">vapor sai por ali.</text>
<circle cx="946" cy="338" r="17" fill="#34d399" stroke="#0b1020" stroke-width="3"/>
<text x="946" y="344" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">3</text>
<text x="976" y="344" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">Faça um laço de gotejamento do lado de fora para a água escorrer em vez de entrar</text>
<text x="976" y="367" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">pelo furo.</text>
<circle cx="946" cy="396" r="17" fill="#34d399" stroke="#0b1020" stroke-width="3"/>
<text x="946" y="402" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">4</text>
<text x="976" y="402" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">Fixe o cabo com abraçadeira sem apertar o isolante; mantenha-o longe de cabos de 220</text>
<text x="976" y="425" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">V (interferência no I2C).</text>
<circle cx="946" cy="454" r="17" fill="#34d399" stroke="#0b1020" stroke-width="3"/>
<text x="946" y="460" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">5</text>
<text x="976" y="460" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">Não encoste a ponta metálica no isopor/plástico quente nem em ovos: leia o ar, não a</text>
<text x="976" y="483" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">superfície.</text>
<circle cx="946" cy="512" r="17" fill="#34d399" stroke="#0b1020" stroke-width="3"/>
<text x="946" y="518" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">6</text>
<text x="976" y="518" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">Sonda IP68 selada tem atraso de 2–4 min: não 'persiga' a leitura; deixe o PI</text>
<text x="976" y="541" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#e6ebff" text-anchor="start">aprender.</text>
<text x="930" y="596" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6ebff" text-anchor="start">Ligação (4 fios)</text>
<circle cx="950" cy="622" r="11" fill="#ef4444" stroke="#0b1020" stroke-width="2"/>
<text x="975" y="628" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6ebff" text-anchor="start">vermelho</text>
<text x="1110" y="628" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#8da0c8" text-anchor="start">VCC</text>
<text x="1230" y="628" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b92" text-anchor="start">→</text>
<text x="1260" y="628" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="start">3V3</text>
<circle cx="950" cy="666" r="11" fill="#e5e7eb" stroke="#0b1020" stroke-width="2"/>
<text x="975" y="672" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6ebff" text-anchor="start">preto</text>
<text x="1110" y="672" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#8da0c8" text-anchor="start">GND</text>
<text x="1230" y="672" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b92" text-anchor="start">→</text>
<text x="1260" y="672" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="start">GND</text>
<circle cx="950" cy="710" r="11" fill="#facc15" stroke="#0b1020" stroke-width="2"/>
<text x="975" y="716" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6ebff" text-anchor="start">amarelo</text>
<text x="1110" y="716" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#8da0c8" text-anchor="start">SCL</text>
<text x="1230" y="716" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b92" text-anchor="start">→</text>
<text x="1260" y="716" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="start">GPIO9</text>
<circle cx="950" cy="754" r="11" fill="#22c55e" stroke="#0b1020" stroke-width="2"/>
<text x="975" y="760" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6ebff" text-anchor="start">verde</text>
<text x="1110" y="760" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#8da0c8" text-anchor="start">SDA</text>
<text x="1230" y="760" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b92" text-anchor="start">→</text>
<text x="1260" y="760" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="start">GPIO8</text>
<text x="930" y="814" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="start">Cores seguem a convenção do cabo da sonda IP68 (SHT30/PVC68). Se não responder, troque amarelo ↔</text>
<text x="930" y="835" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="start">verde — não há risco. Endereço I2C 0x44.</text>
</svg>