<circle cx="492.375" cy="530" r="5" fill="#34d399" stroke="#0b1020" stroke-width="1"/>
<text x="100" y="590" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#8da0c8" text-anchor="start">módulo de relés 8 canais (bobinas 5 V)</text>
<rect x="100" y="640" width="430" height="70" rx="10" fill="#2b1d08" stroke="#fbbf24" stroke-width="2"/>
<text x="315" y="668" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="middle">rede SIP 10 kΩ — comum no 3V3</text>
<text x="315" y="694" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">cada resistor: GPIO → IN (mantém o relé desligado no reset)</text>
<path d="M315,640 L315,566" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#seta)"/>
<rect x="540" y="480" width="34" height="70" rx="6" fill="#05070f" stroke="#8da0c8" stroke-width="2"/>
<text x="557" y="572" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#8da0c8" text-anchor="middle">abertura</text>
<path d="M530,500 L574,500" fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="620" y="230" width="400" height="90" rx="10" fill="#2b0f19" stroke="#b91c4a" stroke-width="3"/>
<text x="820" y="266" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6ebff" text-anchor="middle">bornes do relé: COM · NA · NF</text>
<text x="820" y="292" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#8da0c8" text-anchor="middle">contato NA na FASE da carga</text>
<rect x="620" y="350" width="190" height="80" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="2"/>
<text x="715" y="384" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="middle">fusível 2 A</text>
<text x="715" y="408" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">carga 220 V</text>
<rect x="830" y="350" width="190" height="80" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
<text x="925" y="384" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#34d399" text-anchor="middle">TERRA (PE)</text>
<text x="925" y="408" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="middle">carcaça metálica</text>
<rect x="620" y="470" width="400" height="120" rx="10" fill="#121a30" stroke="#2a3558" stroke-width="2"/>
<text x="640" y="504" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="start">CH1 resistência · CH3 bomba · CH5 LED:  220 V</text>
<text x="640" y="532" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="start">CH2 umidificador 5 V · CH4 bomba de ar 3,7 V</text>
<text x="640" y="560" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#8da0c8" text-anchor="start">CH7 cooler 12 V · CH8 fans 12 V</text>
<text x="820" y="640" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#f43f5e" text-anchor="middle">cabos de 220 V só neste lado</text>
<rect x="1100" y="150" width="650" height="330" rx="16" fill="#121a30" stroke="#2a3558" stroke-width="2"/>
<text x="1122" y="188" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#8da0c8" text-anchor="start">Tabela IN do relé → GPIO do ESP32</text>
<line x1="1122" y1="202" x2="1728" y2="202" stroke="#2a3558" stroke-width="2" stroke-linecap="round"/>
<text x="1130" y="230" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN1</text>
<text x="1186" y="230" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO1</text>
<text x="1186" y="252" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">resistência</text>
<text x="1130" y="286" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN2</text>
<text x="1186" y="286" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO2</text>
<text x="1186" y="308" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">umidificador</text>
<text x="1130" y="342" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN3</text>
<text x="1186" y="342" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO38</text>
<text x="1186" y="364" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">bomba de água</text>
<text x="1130" y="398" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN4</text>
<text x="1186" y="398" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO39</text>
<text x="1186" y="420" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">bomba de ar</text>
<text x="1450" y="230" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN5</text>
<text x="1506" y="230" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO40</text>
<text x="1506" y="252" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">LED ovoscópio</text>
<text x="1450" y="286" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN6</text>
<text x="1506" y="286" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO41</text>
<text x="1506" y="308" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">reservado</text>
<text x="1450" y="342" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN7</text>
<text x="1506" y="342" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO42</text>
<text x="1506" y="364" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">cooler</text>
<text x="1450" y="398" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="start">IN8</text>
<text x="1506" y="398" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="start">→ GPIO7</text>
<text x="1506" y="420" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8da0c8" text-anchor="start">fans (+12 V)</text>
<rect x="1100" y="510" width="650" height="530" rx="16" fill="#121a30" stroke="#2a3558" stroke-width="2"/>
<text x="1122" y="548" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#8da0c8" text-anchor="start">Passo a passo</text>
<line x1="1122" y1="562" x2="1728" y2="562" stroke="#2a3558" stroke-width="2" stroke-linecap="round"/>
<circle cx="1146" cy="584" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="1146" y="590" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">1</text>
<text x="1176" y="590" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Monte o gabinete com a barreira entre baixa tensão e 220 V; só a</text>
<text x="1176" y="612" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">abertura da barreira passa os fios de sinal.</text>
<circle cx="1146" cy="640" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="1146" y="646" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">2</text>
<text x="1176" y="646" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Alimente o ESP32 e o display pelo DC-DC (5 V). Meça 4,9–5,1 V na</text>
<text x="1176" y="668" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">saída, não no pino '5V' do adaptador (diodo).</text>
<circle cx="1146" cy="696" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="1146" y="702" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">3</text>
<text x="1176" y="702" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Ligue um resistor de 10 kΩ de cada IN ao 3V3 (rede SIP). Teste:</text>
<text x="1176" y="724" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">RST com cargas fora da tomada — nenhum LED de relé acende.</text>
<circle cx="1146" cy="752" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="1146" y="758" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">4</text>
<text x="1176" y="758" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Passe os fios de comando (IN1–IN8) pela abertura; sinais com</text>
<text x="1176" y="780" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">fios curtos e separados dos de potência.</text>
<circle cx="1146" cy="808" r="17" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/>
<text x="1146" y="814" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b1020" text-anchor="middle">5</text>
<text x="1176" y="814" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">Feche e rotule os compartimentos; deixe a tampa do 220 V com</text>
<text x="1176" y="836" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6ebff" text-anchor="start">parafuso (não encaixe).</text>
</svg>