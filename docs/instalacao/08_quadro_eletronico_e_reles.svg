<circle cx="441.125" cy="530" r="5" fill="#34d399" stroke="#0b1020" stroke-width="1"/>
<rect x="470.75" y="464" width="43.25" height="44" rx="4" fill="#1e2540" stroke="#4a5a8a" stroke-width="2"/>
