<text x="460" y="362" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle">470 µF + 100 nF</text>
<text x="460" y="380" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#8da0c8" text-anchor="middle">no CO₂ (Vin–GND)</text>
