<rect width="100%" height="100%" fill="url(#gfundo)"/>
<text x="50" y="66" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="38" font-weight="700" fill="#e6ebff" text-anchor="start">Quadro eletrônico: baixa tensão separada do 220 V</text>
<text x="50" y="102" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="400" fill="#8da0c8" text-anchor="start">Dois compartimentos com barreira física; sinais de 3,3 V atravessam por uma abertura; pull-up de 10 kΩ nos relés.</text>
<text x="1750" y="1076" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b92" text-anchor="end">ChocaIoT · guia de instalação · tema escuro</text>
