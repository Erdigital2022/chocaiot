<text x="1624" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="end">1 · GND</text>
<rect x="1300" y="320" width="340" height="150" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="1470" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Fan 2 (PC, 4 fios)</text>
<circle cx="1300" cy="380" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1316" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">4 · PWM</text>
<circle cx="1300" cy="420" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1316" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">3 · tacômetro (livre)</text>
<circle cx="1640" cy="380" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1624" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">2 · +12 V</text>
<circle cx="1640" cy="420" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1624" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="end">1 · GND</text>
<rect x="1300" y="490" width="340" height="150" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="1470" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Fan 3 (PC, 4 fios)</text>
<circle cx="1300" cy="550" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1316" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">4 · PWM</text>
<circle cx="1300" cy="590" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1316" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">3 · tacômetro (livre)</text>
<circle cx="1640" cy="550" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1624" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">2 · +12 V</text>
<circle cx="1640" cy="590" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1624" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="end">1 · GND</text>
<path d="M400,210 L1300,210" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="197" width="110" height="26" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="815" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">1 kΩ</text>
<text x="1100" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">sinal PWM 3,3 V</text>
<path d="M400,380 L1300,380" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="367" width="110" height="26" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="815" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">1 kΩ</text>
<text x="1100" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">sinal PWM 3,3 V</text>
<path d="M400,550 L1300,550" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="537" width="110" height="26" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="815" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">1 kΩ</text>
<text x="1100" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">sinal PWM 3,3 V</text>
<path d="M1740,210 L1740,770" fill="none" stroke="#ea580c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1800,250 L1800,770" fill="none" stroke="#111827" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1640,210 L1740,210" fill="none" stroke="#ea580c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1740" cy="210" r="7" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<path d="M1640,380 L1740,380" fill="none" stroke="#ea580c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1740" cy="380" r="7" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<path d="M1640,550 L1740,550" fill="none" stroke="#ea580c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1740" cy="550" r="7" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<path d="M1640,250 L1731,250 A9,9 0 0 1 1749,250 L1800,250" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1800" cy="250" r="7" fill="#111827" stroke="#fff" stroke-width="2"/>
<path d="M1640,420 L1731,420 A9,9 0 0 1 1749,420 L1800,420" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1800" cy="420" r="7" fill="#111827" stroke="#fff" stroke-width="2"/>
<path d="M1640,590 L1731,590 A9,9 0 0 1 1749,590 L1800,590" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1800" cy="590" r="7" fill="#111827" stroke="#fff" stroke-width="2"/>
<path d="M400,620 L520,620 L520,705 L1731,705 A9,9 0 0 1 1749,705 L1800,705" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1800" cy="705" r="7" fill="#111827" stroke="#fff" stroke-width="2"/>
<text x="900" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">GND comum (ESP32 ↔ fonte)</text>
<rect x="1560" y="770" width="340" height="95" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="1730" y="806" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Fonte 12 V DC</text>
<text x="1730" y="830" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">a mesma que já alimenta os fans/cooler</text>
<circle cx="1740" cy="770" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1726" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">+ 12 V</text>
<circle cx="1800" cy="770" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1814" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">− GND</text>
<rect x="60" y="735" width="640" height="50" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="80" y1="760" x2="110" y2="760" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<text x="118" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">sinal PWM (fio 4)</text>
<line x1="290" y1="760" x2="320" y2="760" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
<text x="328" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">+12 V (fio 2)</text>
<line x1="500" y1="760" x2="530" y2="760" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
<text x="538" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">GND (fio 1)</text>
<text x="60" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Pinagem do conector de fan de 4 fios (padrão Intel): 1 = GND · 2 = +12 V · 3 = tacômetro · 4 = PWM.</text>
<text x="60" y="848" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Na foto do usuário: o fio com a listra / marca "1" é o pino 1 (GND); o seguinte é o +12 V.</text>
<rect x="60" y="880" width="460" height="330" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="80" y="916" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#9a3412" text-anchor="start">1 · Montagem (tudo desligado)</text>
<text x="80" y="950" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">1) Fonte 12 V desligada.</text>
<text x="80" y="974" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">2) + 12 V → pino 2 de cada fan.</text>
<text x="80" y="998" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">3) − da fonte → pino 1 de cada fan.</text>
<text x="80" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">4) GPIO4 → 1 kΩ → pino 4 do fan 1;</text>
<text x="80" y="1046" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">   GPIO5 → fan 2 ; GPIO6 → fan 3.</text>
<text x="80" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">5) GND do ESP32 no − da fonte.</text>
<text x="80" y="1094" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">6) Pino 3 (tacômetro): sem ligar.</text>
<text x="80" y="1118" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#7c2d12" text-anchor="start">7) Os módulos IRF520 saem do circuito.</text>
<rect x="540" y="880" width="460" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="560" y="916" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a" text-anchor="start">2 · Por que mudou</text>
<text x="560" y="950" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">· Fan de 4 fios já tem o próprio driver:</text>
<text x="560" y="974" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">  quer 12 V sempre presente.</text>
<text x="560" y="998" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">· Chavear o 12 V a 1 kHz (IRF520)</text>
<text x="560" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">  faz o fan zumbir, falhar ou nem partir.</text>
<text x="560" y="1046" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">· A velocidade vai no fio 4: PWM de 25 kHz</text>
<text x="560" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">  (3,3 V do ESP32 funciona).</text>
<text x="560" y="1094" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">· Sem sinal no fio 4 o fan gira a 100 %.</text>
<text x="560" y="1118" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a8a" text-anchor="start">· 1 kΩ em série protege o GPIO.</text>
<rect x="1020" y="880" width="460" height="330" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="1040" y="916" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#166534" text-anchor="start">3 · Teste</text>
<text x="1040" y="950" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">1) Ligue a fonte: os fans giram a 100 %</text>
<text x="1040" y="974" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">   (ainda sem PWM do ESP32).</text>
<text x="1040" y="998" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">2) Grave o firmware (Fase 104).</text>
<text x="1040" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">3) Config. > Fans: ligue a chave e</text>
<text x="1040" y="1046" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">   ajuste cada fan (0–100 %).</text>
<text x="1040" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">4) 0 % = mínimo do fan; muitos mantêm</text>
<text x="1040" y="1094" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">   20–30 %, alguns param.</text>
<text x="1040" y="1118" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#14532d" text-anchor="start">5) Fan mudo? Teste pino 2 (+) e 1 (−).</text>
<rect x="1500" y="880" width="440" height="330" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1520" y="916" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#5b21b6" text-anchor="start">4 · Notas</text>
<text x="1520" y="950" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">· Liga/desliga geral (opcional): passe o</text>
<text x="1520" y="974" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">  +12 V pelo contato NA do relé CH8 Fans.</text>
<text x="1520" y="998" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">· Fan de 3 fios (sem fio PWM): use o</text>
<text x="1520" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">  IRF520 como no esquema 04.</text>
<text x="1520" y="1046" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">· Tacômetro: sobra o GPIO17 (1 fan);</text>
<text x="1520" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">  GPIO15/16 estão no sensor de CO₂.</text>
<text x="1520" y="1094" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4c1d95" text-anchor="start">· Todos os fans na MESMA fonte e GND.</text>
</svg>