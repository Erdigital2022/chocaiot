<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1240" viewBox="0 0 2000 1240"><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="60" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="start">Fans de PC de 4 fios — 12 V fixo + PWM de 25 kHz no fio 4 (sem módulo IRF520)</text>
<text x="60" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">A fonte alimenta o fan direto (12 V sempre ligado). A velocidade vem do sinal PWM do ESP32 no fio 4. Cada fan usa um GPIO próprio; os GNDs são comuns.</text>
<rect x="60" y="150" width="340" height="520" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="230" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-S3</text>
<text x="230" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">YD-ESP32-S3 44P · N16R8</text>
<circle cx="400" cy="210" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="380" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="end">GPIO4</text>
<text x="380" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="end">PWM 25 kHz · fan 1</text>
<circle cx="400" cy="380" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="380" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="end">GPIO5</text>
<text x="380" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="end">PWM 25 kHz · fan 2</text>
<circle cx="400" cy="550" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="380" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="end">GPIO6</text>
<text x="380" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="end">PWM 25 kHz · fan 3</text>
<circle cx="400" cy="620" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="380" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="end">GND</text>
<rect x="1300" y="150" width="340" height="150" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="1470" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Fan 1 (PC, 4 fios)</text>
<circle cx="1300" cy="210" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1316" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">4 · PWM</text>
<circle cx="1300" cy="250" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1316" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">3 · tacômetro (livre)</text>
<circle cx="1640" cy="210" r="7" fill="#e5b73b" stroke="#7a5b00" stroke-width="2"/>
<text x="1624" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">2 · +12 V</text>
