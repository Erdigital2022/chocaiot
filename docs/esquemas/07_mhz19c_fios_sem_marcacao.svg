<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1380" viewBox="0 0 2000 1380"><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="60" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="start">MH-Z19C — descobrir os fios SEM marcações na placa (pela posição no conector)</text>
<text x="60" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">O módulo é a versão 'terminal': 7 pads + conector branco de 7 vias. Cada fio ocupa uma posição fixa do conector; a posição define a função.</text>
<rect x="40" y="130" width="1920" height="470" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="64" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">1) Ordem real dos fios no seu conector (fotos: etiqueta para cima, esquerda → direita)</text>
<text x="64" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#475569" text-anchor="start">fio (cor)</text>
<text x="64" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Hipótese A</text>
<text x="64" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">pino 1 = lado do marrom</text>
<text x="64" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Hipótese B</text>
<text x="64" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">pino 1 = lado do amarelo</text>
<circle cx="330" cy="262" r="30" fill="#92400e" stroke="#334155" stroke-width="3"/>
<text x="330" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">marrom</text>
<rect x="240" y="340" width="180" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<text x="330" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 1</text>
<text x="330" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">HD</text>
<rect x="240" y="460" width="180" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<text x="330" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 7</text>
<text x="330" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">PWM</text>
<circle cx="545" cy="262" r="30" fill="#ffffff" stroke="#334155" stroke-width="3"/>
<text x="545" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">branco</text>
<rect x="455" y="340" width="180" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<text x="545" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 2</text>
<text x="545" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Reservado</text>
<rect x="455" y="460" width="180" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="545" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 6</text>
<text x="545" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">TX</text>
<circle cx="760" cy="262" r="30" fill="#111827" stroke="#334155" stroke-width="3"/>
<text x="760" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">preto</text>
<rect x="670" y="340" width="180" height="100" rx="10" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<text x="760" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 3</text>
<text x="760" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">GND</text>
<rect x="670" y="460" width="180" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="760" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 5</text>
<text x="760" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">RX</text>
<rect x="875" y="190" width="200" height="376" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="975" cy="262" r="30" fill="#dc2626" stroke="#334155" stroke-width="3"/>
<text x="975" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">vermelho</text>
<rect x="885" y="340" width="180" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="975" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 4</text>
<text x="975" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Vin +5 V</text>
<rect x="885" y="460" width="180" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="975" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 4</text>
<text x="975" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Vin +5 V</text>
<circle cx="1190" cy="262" r="30" fill="#2563eb" stroke="#334155" stroke-width="3"/>
<text x="1190" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">azul</text>
<rect x="1100" y="340" width="180" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="1190" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 5</text>
<text x="1190" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">RX</text>
<rect x="1100" y="460" width="180" height="100" rx="10" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<text x="1190" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 3</text>
<text x="1190" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">GND</text>
<circle cx="1405" cy="262" r="30" fill="#15803d" stroke="#334155" stroke-width="3"/>
<text x="1405" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">verde</text>
<rect x="1315" y="340" width="180" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="1405" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 6</text>
<text x="1405" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">TX</text>
<rect x="1315" y="460" width="180" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<text x="1405" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 2</text>
<text x="1405" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Reservado</text>
<circle cx="1620" cy="262" r="30" fill="#facc15" stroke="#334155" stroke-width="3"/>
<text x="1620" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">amarelo</text>
<rect x="1530" y="340" width="180" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<text x="1620" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 7</text>
<text x="1620" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">PWM</text>
<rect x="1530" y="460" width="180" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<text x="1620" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">pino 1</text>
<text x="1620" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">HD</text>
<text x="64" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412" text-anchor="start">O fio do MEIO (vermelho) é o pino 4 = Vin (+5 V) nas duas hipóteses. Só falta saber de que lado fica o GND: preto (A) ou azul (B).</text>
<rect x="40" y="620" width="1190" height="720" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="64" y="658" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">2) Testes (nesta ordem) — tudo DESLIGADO, sensor sem ligar em nada</text>
<text x="64" y="696" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="start">Teste 1 — decisivo: o GND encosta na carcaça</text>
<text x="84" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Multímetro em continuidade (bipe). Uma ponta na superfície dourada do sensor (ou numa das</text>
<text x="84" y="749" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">bolinhas prateadas de solda nos cantos da placa); a outra ponta no fio PRETO, depois no AZUL.</text>
<text x="84" y="774" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Apitou com o PRETO  → GND = preto  → Hipótese A.      Apitou com o AZUL → GND = azul → Hipótese B.</text>
<text x="84" y="799" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Se nenhum apitar (carcaça não é GND), siga para o Teste 2.</text>
<text x="64" y="846" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="start">Teste 2 — indício: resistência a partir do vermelho (Vin)</text>
<text x="84" y="874" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Multímetro em Ω. Meça vermelho–preto e vermelho–azul, e depois inverta as pontas e meça de novo.</text>
<text x="84" y="899" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">O vizinho que é GND costuma dar o MENOR valor (o seu vermelho–preto = 671 já é um bom sinal).</text>
<text x="84" y="924" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">'Não apitou' é normal: o bipe só vem abaixo de ~50 Ω; 671 Ω quer dizer 'sem curto'.</text>
<text x="64" y="971" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="start">Teste 3 — confirmar com energia (só com o 1 ou o 2 conclusivo)</text>
<text x="84" y="999" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Ligue SÓ Vin (vermelho) → +5 V do DC-DC e GND (o fio decidido) → GND. TX e RX ainda soltos.</text>
<text x="84" y="1024" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Medindo em DC V contra o GND: o fio PWM é o único que fica oscilando; HD e TX ficam perto de 3,3 V.</text>
<text x="84" y="1049" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Se o sensor ficar morno em segundos ou o fio vermelho mostrar menos de 4,5 V: desligue e reveja.</text>
<text x="64" y="1096" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="start">Teste 4 — UART no ESP32</text>
<text x="84" y="1124" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Ligue TX do sensor no GPIO16 e RX do sensor no GPIO15. Espere 3 min (aquecimento).</text>
<text x="84" y="1149" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Sem valor de CO₂? Troque os dois fios de lugar (inofensivo) e espere mais 3 min.</text>
<rect x="1250" y="620" width="710" height="720" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1274" y="658" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">3) Ligação conforme o resultado</text>
<rect x="1274" y="684" width="662" height="290" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1294" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="start">Hipótese A (GND = preto)</text>
<text x="1294" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">vermelho    → +5 V do DC-DC  (Vin)</text>
<text x="1294" y="776" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">preto   → GND comum</text>
<text x="1294" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">azul    → GPIO15  (RX do sensor ← TX do ESP32)</text>
<text x="1294" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">verde   → GPIO16  (TX do sensor → RX do ESP32)</text>
<text x="1294" y="860" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">marrom (HD), branco (reservado), amarelo (PWM): isolar</text>
<text x="1294" y="904" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Se o log disser 'sem resposta': troque azul ↔ verde.</text>
<rect x="1274" y="990" width="662" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1294" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="start">Hipótese B (GND = azul)</text>
<text x="1294" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">vermelho    → +5 V do DC-DC  (Vin)</text>
<text x="1294" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">azul    → GND comum</text>
<text x="1294" y="1110" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">preto   → GPIO15  (RX do sensor ← TX do ESP32)</text>
<text x="1294" y="1138" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">branco  → GPIO16  (TX do sensor → RX do ESP32)</text>
<text x="1294" y="1166" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start">amarelo (HD), verde (reservado), marrom (PWM): isolar</text>
<text x="1294" y="1210" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Se o log disser 'sem resposta': troque preto ↔ branco.</text>
<text x="1274" y="1316" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">Alimentação: 5,0 V ±0,1 V, ≥ 150 mA. Nunca no 3V3 nem no pino '5V' do adaptador.</text>
</svg>